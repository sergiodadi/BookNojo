[package]
name = "booknojo"
# Kept in sync with the root Cargo.toml's version — the previous static
# "0.1.0" meant both this crate's own env!("CARGO_PKG_VERSION") (the About
# BookNojo dialog) and tauri.conf.json's bundle version were silently
# stale since the app was scaffolded.
version = "0.69.0"
description = "BookNojo"
authors = ["Serge"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "booknojo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# Native "Importer une collection..." picker (étape 4 : menu File > Import a collection...).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The existing CLI tools' shared library (../../src/lib.rs) — reused as-is
# for reading a collection, rather than duplicating ~150 lines of joins.
book_collector_export = { path = "../.." }

[dev-dependencies]
# "test" feature only (Cargo keeps it out of release builds, since
# dev-dependencies never compile into `cargo build`) — needed for
# `tauri::test::mock_app`, used to unit-test `grant_asset_scope_for_collection`
# without actually opening a window.
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
