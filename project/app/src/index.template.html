<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BookNojo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📚 BookNojo</h1>
  <span id="fileBadge"></span>
  <span id="appVersion">Ⓥ BookNojo</span>
  <button id="addBtn">➕ Ajouter un livre</button>
  <button id="statsBtn">📊 Statistiques</button>
</header>
<div id="tabs"></div>
<main>
  <aside id="groups">
    <div id="groupHeader">
      <select id="groupField">
        <option value="authors">Auteur</option>
        <option value="genres">Genre</option>
        <option value="publisher">Éditeur</option>
        <option value="format">Format</option>
        <option value="language">Langue</option>
        <option value="country">Pays</option>
      </select>
    </div>
    <div id="azbar"></div>
    <div id="groupList"></div>
  </aside>
  <div id="splitterV" title="Glisser pour redimensionner"></div>
  <div id="rightCol">
    <div id="bookListPane">
      <div id="listToolbar">
        <span class="count" id="count"></span>
        <select id="sort">
          <option value="title">Titre (A→Z)</option>
          <option value="author">Auteur (A→Z)</option>
          <option value="year_desc">Année (récent d'abord)</option>
          <option value="publisher">Éditeur (A→Z)</option>
        </select>
        <input id="search" type="search" placeholder="Rechercher titre ou auteur…">
        <div id="viewToggle">
          <button id="viewList" class="active">☰ Liste</button>
          <button id="viewGrid">▦ Grille</button>
        </div>
      </div>
      <div id="colHeader">
        <span data-sort="title">Titre</span>
        <span data-sort="author">Auteur</span>
      </div>
      <div id="rows"></div>
      <div id="pager">
        <button id="prev">‹ Préc.</button>
        <span id="pageinfo"></span>
        <button id="next">Suiv. ›</button>
      </div>
    </div>
    <div id="splitterH" title="Glisser pour redimensionner"></div>
    <div id="detail"><div id="empty">Sélectionnez un livre.</div></div>
  </div>
</main>
<div id="statsPane"></div>
<div id="addPane"></div>
<script id="data" type="application/json">__DATA_JSON__</script>
<script src="app.js"></script>
</body>
</html>
