[package]
name = "book_collector_export"
version = "0.99.0"
edition = "2021"
license = "MIT"

[lib]
name = "book_collector_export"
path = "src/lib.rs"

[[bin]]
name = "bc_export"
path = "src/main.rs"

[[bin]]
name = "bc_add"
path = "src/bin/bc_add.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
# Online book-metadata lookup (Open Library / Google Books / BnF), étape 1
# du plan "Recherche en ligne". `blocking` feature deliberately chosen
# over async reqwest + tokio: the rest of this project (rusqlite, every
# existing function) is synchronous, and bc_add/bc_export have no async
# runtime at all — adding tokio just for this would be a new
# architectural element for one feature. The 3 sources will be queried
# in parallel later via plain `std::thread::spawn`, not async.
reqwest = { version = "0.12", features = ["blocking", "json"] }
# Parses the BnF SRU service's UNIMARC/MarcXchange XML response (no JSON
# output offered by that service). Namespace-agnostic local-name lookups
# (tag_name().name()) sidestep needing the exact srw:/mx: namespace URIs.
roxmltree = "0.20"
